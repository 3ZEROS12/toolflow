name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then
            npm ci
          elif node -e "const p=require('./package.json'); process.exit(p.dependencies || p.devDependencies ? 0 : 1)"; then
            npm install
          fi

      - name: Polymorphic validation
        shell: bash
        run: |
          if node -e "process.exit(require('./package.json').scripts?.ci ? 0 : 1)"; then
            npm run ci
          elif node -e "process.exit(require('./package.json').scripts?.check ? 0 : 1)"; then
            npm run check
          elif node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          elif node -e "process.exit(require('./package.json').scripts?.typecheck ? 0 : 1)"; then
            npm run typecheck
          fi
